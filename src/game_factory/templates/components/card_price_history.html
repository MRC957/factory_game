<div class="card">
  <div class="chart-toolbar">
    <div class="card-title" id="price-history-title" style="margin-bottom:0;">Price History</div>
    <button class="btn-primary" id="btn-toggle-history" onclick="togglePriceHistory()">Show Price History</button>
  </div>
  <div id="price-history-panel" style="display:none;">
    <svg id="price-chart-svg" viewBox="0 0 780 220" preserveAspectRatio="none"></svg>
    <div class="chart-note" id="chart-note">Track an item to view its market price evolution.</div>
  </div>
</div>
