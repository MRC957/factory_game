<div id="status-bar">
  <span id="title">⚙ FACTORY GAME</span>

  <div class="stat-block">
    <span class="stat-label" id="lbl-day">Day</span>
    <span class="stat-value val-day" id="stat-day">1</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-time">Time</span>
    <span class="stat-value" id="stat-time">08:00</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-market-status">Market</span>
    <span class="stat-value" id="stat-market-status">Open</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-cash">Cash</span>
    <span class="stat-value val-cash" id="stat-cash">$500.00</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-workers">Workers</span>
    <span class="stat-value" id="stat-workers">0</span>
    <span class="stat-label" id="stat-workers-detail">(0 free)</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-salary">Daily salary</span>
    <span class="stat-value" id="stat-salary">$0.00</span>
  </div>
  <span class="sep">|</span>
  <div class="stat-block">
    <span class="stat-label" id="lbl-lang">Language</span>
    <select id="lang-select" class="lang-select" onchange="setLanguage(this.value)">
      <option value="en">EN</option>
      <option value="fr">FR</option>
    </select>
  </div>
</div>
